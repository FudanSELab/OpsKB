        prompt_template:
        - id: 59741914-0250-47a0-afd4-7d2631ca3f99
          role: system
          text: "你是一个知识图谱构建专家，请从给定的自然语言文本中抽取出实体、事件和模型节点，并基于抽取的节点推断它们之间的关系（如调用、触发、涉及等），将关系和节点一起输出。\n\
            \n## 抽取要求：\n\n### 1. 节点抽取格式：\n\n- **事件节点**：\n  - type: \"node\"\n  - labels:\
            \ [\"event\", \"事件类别\"]（事件类别从标签分类体系中选择）\n  - properties: 必须包含name属性，以及其他属性如time、geo、detect、classify、legal、risk、entities、models、relations等（属性值需从文本中提取或合理推断）\n\
            \n- **实体节点**：\n  - type: \"node\"\n  - labels: [\"entity\", \"实体类别\"]（实体类别从标签分类体系中选择）\n\
            \  - properties: 必须包含name属性和type属性（type值为实体类别），以及其他相关技术属性（从文本中提取或合理推断）\n\
            \n- **模型节点**：\n  - type: \"node\"\n  - labels: [\"model\", \"模型类别\"]（模型类别从标签分类体系中选择）\n\
            \  - properties: 必须包含name属性和type属性（type值为模型类别），以及其他相关技术参数（从文本中提取或合理推断）\n\
            \n### 2. 关系抽取格式：\n\n- 基于抽取的节点，推断节点之间的关系（如调用、触发、涉及等），并创建关系节点。\n- 关系节点格式：\n\
            \  - type: \"relationship\"\n  - label: 关系类型（如\"调用\"、\"触发\"、\"使用\"等）\n\
            \  - properties: 必须包含desc属性，描述关系内容（从文本中推断）\n  - start: 必须包含name和labels，name必须与某个已抽取节点的name完全一致，labels必须与该节点的labels一致\n\
            \  - end: 必须包含name和labels，name必须与某个已抽取节点的name完全一致，labels必须与该节点的labels一致\n\
            - 注意：关系节点中不包含id字段，id将由数据库自动生成。\n\n## 标签分类体系：\n\n- **实体类标签**：探测类、识别类、系统类、干扰类、打击类、无人机、监测类\n\
            - **事件类标签**：关键资源失效类、任务变化类、系统受损类\n- **模型类标签**：策略规则类、经验预案类、算法模型类\n\n## 特别注意：\n\
            \n- 所有节点（事件、实体、模型）必须包含name属性。\n- 实体节点必须包含type属性，值为对应的实体类别。\n- 模型节点必须包含type属性，值为对应的模型类别。\n\
            - 节点和关系节点中均不包含id字段，id将由数据库自动生成。\n- 关系节点中的start和end的name必须与已抽取节点的name完全一致，labels必须一致。\n\
            - 关系的推断应基于文本内容，确保合理性和逻辑性。\n\n## 输出格式要求：\n\n最终输出必须严格按照以下JSON格式：\n\n```json\n\
            {\n  \"data\": [\n    {抽取或推断的节点1},\n    {抽取或推断的节点2},\n    ...,\n    {关系节点1},\n\
            \    {关系节点2},\n    ...\n  ]\n}\n```\n\n节点和关系节点均放在\"data\"数组中，顺序不限。\n\n\
            如果文本内容不涉及无人机相关领域知识，直接返回：\n\n```json\n{\"data\":[]}\n```\n\n请基于以上规范，仔细分析输入文本，抽取出所有相关的事件、实体和模型节点，并推断它们之间的关系，确保所有节点和关系符合格式要求。关系的desc属性应简洁描述关系内容（如\"\
            调用\"、\"触发\"等）。"
