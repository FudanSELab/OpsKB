        prompt_template:
        - id: 59741914-0250-47a0-afd4-7d2631ca3f99
          role: system
          text: "请从目标图片中提取关键信息，仅生成**实体类**和**事件类**两类知识图谱节点，节点`id`统一设为“new generate”，具体要求如下：\n\
             \n 注意：只生成跟无人机反制场景有关的知识，如果全都无关则输出:{\"data\":[]}\n## 一、抽取目标与范围\n### 1.\
            \ 实体类节点\n- **涵盖对象**：反无人机相关设备（探测类、干扰类、系统类、打击类、识别类、监测类）、无人机类，可根据图片实际内容补充其他相关实体。 \n\
            - **需提取的关键信息**： \n  - 名称（`name`属性，可模糊表述，若图片中信息不完整，标注“模糊：XXX”即可，如“模糊：TX-XQ系列反制枪”）； \n\
              - 所属公司（若图片中提及，需提取；未提及可不填）； \n  - 核心技术参数（根据实体类型提取，如探测类提探测距离、干扰类提干扰频段、设备类提重量/尺寸/工作温度、无人机产品提飞行速度/续航等，图片中有则提，无则不强行补充）； \n\
              - 功能特性（如预警目标、反制效果、监控能力、载荷类型等，结合实体实际功能提取）。\n  - 其它与此实体有关的属性\n### 2. 事件类节点\n\
            - **涵盖对象**：任务变化类事件（新增目标、目标方位变化、高频干扰源增加等）、系统受损类事件（设备损坏、系统瘫痪、电池耗尽等）、关键资源失效类事件（反制枪失效、雷达设备失效等）。 \n\
            - **需提取的关键信息**： \n  - 事件名称（`name`属性，可模糊概括，如“模糊：多目标出现导致探测压力增加”）； \n  -\
            \ 发生时间（图片中有则提，格式不限，如“2023年5月”“2024年6月18日下午”）； \n  - 发生地点（含经纬度+高度，图片中有则提，信息不全可补“模糊”，如“东经115左右；北纬39左右；高度模糊”）； \n\
              - 产生影响（事件导致的后果，如“探测精度下降”“反制范围缩小”）； \n  - 处置规范流程（应对事件的操作，如“启用备用设备”“更换电池”）； \n\
              - 处置支撑模型（图片中提及的模型名称，未提及可不填）； \n  - 关联单元（相关设备、单元等，有则提，无则不填）； \n  - 发生条件（事件触发原因，如“物理损坏”“电磁干扰”，有则提，无则不填）。\n\
              - 其它与此事件有关的属性\n \n## 二、知识图谱节点格式规范\n每个节点需包含以下字段，无固定格式要求，确保信息清晰即可：\n-\
            \ `type`：固定为“node”； \n- `id`：固定为“new generate”； \n- `labels`：实体类节点标注为[\"\
            entity\", 细分类型]（如[\"entity\",\"探测类\"]），事件类节点标注为[\"event\", 细分类型]（如[\"\
            event\",\"任务变化类\"]）； \n- `properties`：包含上述需提取的关键信息，`name`属性需包含在内，其他信息按图片实际内容补充，无顺序要求。\n\
             \n### 格式示例\n1. 实体类（干扰类设备）示例： \n{\"type\":\"node\",\"id\":\"new generate\"\
            ,\"labels\":[\"entity\",\"干扰类\"],\"properties\":{\"name\":\"模糊：TX-FPV系列干扰器\"\
            ,\"公司\":\"深圳特信电子有限公司\",\"重量\":\"约1.6kg\",\"干扰频段\":\"2.4G、5.8G\",\"功能特性\"\
            :\"手提式，可屏蔽无人机信号\"}}\n \n2. 事件类（系统受损类）示例： \n{\"type\":\"node\",\"id\":\"\
            new generate\",\"labels\":[\"event\",\"系统受损类\"],\"properties\":{\"name\"\
            :\"反制枪受损\",\"发生时间\":\"2023年4月12日早上\",\"发生地点\":\"东经116.28；北纬39.68；高度0\"\
            ,\"产生影响\":\"单一目标识别能力下降\",\"处置规范流程\":\"启用备用反制枪\",\"处置支撑模型\":\"损伤控制模型\"\
            ,\"发生条件\":\"物理损坏\",\"关联单元\":\"作战单元B\"}}\n \n \n## 三、抽取注意事项\n1. 无需追求格式绝对统一，时间、地点、参数等表述以图片实际信息为准，模糊信息标注“模糊”即可； \n\
            2. 仅生成实体类、事件类节点，不涉及任何模型类节点； \n3. `properties`中必须包含`name`属性，其他信息按需提取，不强行补充图片中没有的内容； \n\
            4. 属性与节点类型匹配，如“探测距离”仅用于探测类实体，“发生条件”仅用于事件类节点。\n5.若是无人机以外的知识直接输出:{\"data\"\
            :[]}\n##四、输出要求\n节点顺序：按 “实体类→事件类” 的顺序排列（先提取所有实体类节点，再提取所有事件类节点），每个节点为独立\
            \ JSON 对象。\n格式校验：输出前需检查三点：①是否仅含实体类、事件类节点；②所有节点id是否为 “new generate”；③所有节点是否包含name属性。\n\
            最终格式：以 JSON 数组形式输出，确保可直接导入知识图谱工具使用，示例如下：\n成功抽取格式：\n{\n  \"data\": [\n\
            \    {\n      \"type\": \"node\",\n      \"id\": \"new generate\",\n \
            \     \"labels\": [\"entity\", \"探测类\"],\n      \"properties\": {\n  \
            \      \"name\": \"ZY-R2000 低空目标监测预警打击系统\",\n        \"公司\": \"知语云智能科技\"\
            ,\n        \"type\": \"探测类\",\n        \"预警目标\": \"无人机、轻型飞机、滑翔机等\",\n\
            \        \"监控时长\": \"24 小时\"\n      }\n    },\n    {\n      \"type\":\
            \ \"node\",\n      \"id\": \"new generate\",\n      \"labels\": [\"event\"\
            , \"任务变化类\"],\n      \"properties\": {\n        \"name\": \"新增目标在监测范围外\"\
            ,\n        \"发生时间\": \"2024 年 3 月 20 日 08:45\",\n        \"发生地点\": \"\
            东经：120.38; 北纬：36.06; 高度：0\",\n        \"产生影响\": \"探测覆盖范围不足，覆盖率下降至 70%-50%\"\
            ,\n        \"处置规范流程\": \"部署 TX-TC-01 探测设备并启用无人机屏蔽器\",\n        \"处置支撑模型\"\
            : \"多目标优化搜索模型\",\n        \"关联单元\": \"CD-WRJ02 探测反制一体设备\",\n        \"\
            type\": \"任务变化类\"\n      }\n    },\n...\n  ]\n}\n若是无关的知识：\n{\"data\":[]}"
